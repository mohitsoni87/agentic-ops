---
# ServiceAccount the agent pod runs as
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-ops
  namespace: agentic-ops
  labels:
    app.kubernetes.io/name: agentic-ops

---
# ClusterRole — read-only access to pods, logs, events across all namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentic-ops-watcher
  labels:
    app.kubernetes.io/name: agentic-ops
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

---
# Bind the ClusterRole to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentic-ops-watcher-binding
  labels:
    app.kubernetes.io/name: agentic-ops
subjects:
  - kind: ServiceAccount
    name: agentic-ops
    namespace: agentic-ops
roleRef:
  kind: ClusterRole
  name: agentic-ops-watcher
  apiGroup: rbac.authorization.k8s.io
