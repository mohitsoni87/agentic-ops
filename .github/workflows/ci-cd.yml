name: CI/CD — Build, Test, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/agentic-ops
  K8S_NAMESPACE: agentic-ops

jobs:
  # ── Job 1: Test ────────────────────────────────────────────────────────────
  test:
    name: Lint & Import Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.9.8

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Run import + graph test
        run: |
          python -c "
          from src.agentic_ops.config import settings
          from src.agentic_ops.state import AgentState
          from src.agentic_ops.graph import build_graph
          graph = build_graph()
          nodes = set(graph.nodes.keys())
          assert {'rca', 'solution', 'notify'}.issubset(nodes), f'Missing nodes: {nodes}'
          print('All checks passed:', nodes)
          "

  # ── Job 2: Build & Push Docker image ──────────────────────────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'   # only on main branch

    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (short SHA)
        id: meta
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to Kubernetes ────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy manifests
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          # Apply namespace and RBAC first
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-rbac.yaml
          kubectl apply -f k8s/02-configmap.yaml
          kubectl apply -f k8s/04-postgres.yaml

          # Wait for postgres
          kubectl rollout status deployment/postgres \
            -n $K8S_NAMESPACE --timeout=120s

          # Swap image placeholder and apply agent deployment
          sed "s|YOUR_DOCKERHUB_USERNAME/agentic-ops:latest|${{ env.IMAGE_NAME }}:${IMAGE_TAG}|g" \
            k8s/05-deployment.yaml | kubectl apply -f -

          # Wait for rollout
          kubectl rollout status deployment/agentic-ops \
            -n $K8S_NAMESPACE --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get pods -n $K8S_NAMESPACE
          kubectl get deployment agentic-ops -n $K8S_NAMESPACE

  # ── Job 4: Seed KB (manual trigger only) ──────────────────────────────────
  seed-kb:
    name: Seed Knowledge Base
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'  # only via manual trigger

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run seed job
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
        run: |
          sed "s|YOUR_DOCKERHUB_USERNAME/agentic-ops:latest|${{ env.IMAGE_NAME }}:${IMAGE_TAG}|g" \
            k8s/06-seed-job.yaml | kubectl apply -f -

          kubectl wait --for=condition=complete job/kb-seed \
            -n $K8S_NAMESPACE --timeout=300s

          kubectl logs job/kb-seed -n $K8S_NAMESPACE

          kubectl delete job/kb-seed -n $K8S_NAMESPACE

    # Allow manual trigger with optional image_tag input
    # Enable via: Actions tab → "Run workflow"
