[project]
name = "agentic-ops"
version = "0.1.0"
description = "LangGraph multi-agent Kubernetes ops monitoring system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.1",
    "langchain-openai>=1.2.2",
    "langchain-core>=1.4.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.4.2",
    "sqlalchemy[asyncio]>=2.0",
    "kubernetes>=36.0.0",
    "pydantic-settings>=2.14.1",
    "httpx>=0.28.1",
    "aiosmtplib>=5.1.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ops"]
